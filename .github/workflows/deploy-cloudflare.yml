name: Deploy to Cloudflare with Wrangler

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy frontend to Cloudflare Pages"
        type: boolean
        default: true
      deploy_worker:
        description: "Deploy worker/ with wrangler deploy if worker/wrangler.toml exists"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: Deploy frontend to Cloudflare Pages
    if: ${{ github.event_name == 'push' || inputs.deploy_pages }}
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME }}
      # Important:
      # vite.config.ts uses GitHub Pages style base path when GITHUB_ACTIONS=true.
      # Cloudflare Pages should normally serve from site root, so force VITE_BASE=/.
      VITE_BASE: /

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare settings
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$CF_PAGES_PROJECT_NAME" ]; then
            echo "Missing repository variable: CF_PAGES_PROJECT_NAME"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy Pages with Wrangler
        run: |
          npx wrangler@latest pages deploy dist \
            --project-name="$CF_PAGES_PROJECT_NAME" \
            --branch="${GITHUB_REF_NAME}" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${GITHUB_SHA}"

  deploy-worker:
    name: Deploy optional Worker
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_worker }}
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Deploy worker/ with Wrangler if present
        shell: bash
        run: |
          if [ ! -f worker/wrangler.toml ]; then
            echo "worker/wrangler.toml not found. Skipping Worker deploy."
            exit 0
          fi

          cd worker

          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

          npx wrangler@latest deploy
