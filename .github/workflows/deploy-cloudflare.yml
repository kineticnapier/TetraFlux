name: Deploy to Cloudflare with Wrangler

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy frontend to Cloudflare Pages"
        type: boolean
        default: true
      deploy_worker:
        description: "Deploy log upload Worker"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-worker:
    name: Deploy log upload Worker
    if: ${{ github.event_name == 'push' || inputs.deploy_worker }}
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloudflare settings
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Install worker dependencies
        working-directory: worker
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install --include=optional --no-audit --no-fund

      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler@latest deploy

  deploy-pages:
    name: Deploy frontend to Cloudflare Pages
    needs: [deploy-worker]
    if: ${{ always() && (github.event_name == 'push' || inputs.deploy_pages) }}
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME }}
      VITE_BASE: /
      VITE_LOG_UPLOAD_URL: ${{ vars.VITE_LOG_UPLOAD_URL }}

      R2_LOG_BUCKET: ${{ vars.R2_LOG_BUCKET || 'tetraflux-logs' }}
      R2_MODEL_KEY: ${{ vars.R2_MODEL_KEY || 'models/latest/web_policy.json' }}

      PY: .venv/bin/python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Create Python venv with uv
        shell: bash
        run: |
          uv python install 3.11
          uv venv --python 3.11 .venv
          .venv/bin/python --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloudflare settings
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$CF_PAGES_PROJECT_NAME" || (echo "Missing repository variable: CF_PAGES_PROJECT_NAME" && exit 1)
          if [ -z "$VITE_LOG_UPLOAD_URL" ]; then
            echo "WARNING: VITE_LOG_UPLOAD_URL is empty. Upload Logs button will not work."
          fi

      - name: Install Python deps for model sync
        shell: bash
        run: |
          uv pip install --python "$PY" boto3>=1.34.0

      - name: Sync latest model from R2 before build
        shell: bash
        run: |
          if [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ]; then
            "$PY" tools/sync_web_policy_r2.py download \
              --bucket "$R2_LOG_BUCKET" \
              --key "$R2_MODEL_KEY" \
              --file public/models/web_policy.json \
              --allow-missing
          else
            echo "R2 secrets are missing; removing local stale public/models/web_policy.json"
            rm -f public/models/web_policy.json
          fi

      - name: Install frontend dependencies
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install --include=optional --no-audit --no-fund
          node -e "require('@rollup/rollup-linux-x64-gnu'); console.log('rollup native optional package OK')"

      - name: Build frontend
        run: npm run build

      - name: Inspect model in dist
        shell: bash
        run: |
          if [ -f dist/models/web_policy.json ]; then
            "$PY" - <<'PY'
            import json, pathlib
            p = pathlib.Path("dist/models/web_policy.json")
            data = json.loads(p.read_text(encoding="utf-8"))
            print("DEPLOY MODEL:")
            for k in ["model_id", "model_name", "exported_at", "checkpoint_mtime_utc", "checkpoint_sha256_12"]:
                print(f"  {k}: {data.get(k)}")
            print("  size:", p.stat().st_size)
            PY
          else
            echo "No dist/models/web_policy.json; Web will use HeuristicAI fallback."
          fi

      - name: Deploy Pages with Wrangler
        run: |
          npx wrangler@latest pages deploy dist \
            --project-name="$CF_PAGES_PROJECT_NAME" \
            --branch="${GITHUB_REF_NAME}" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${GITHUB_SHA}"
