name: Deploy to Cloudflare with Wrangler

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy frontend to Cloudflare Pages"
        type: boolean
        default: true
      deploy_worker:
        description: "Deploy log upload Worker"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-worker:
    name: Deploy log upload Worker
    if: ${{ github.event_name == 'push' || inputs.deploy_worker }}
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloudflare settings
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Install worker dependencies
        working-directory: worker
        shell: bash
        run: |
          # Work around npm/Rollup optional dependency lockfile issue.
          rm -rf node_modules package-lock.json
          npm install --include=optional --no-audit --no-fund

      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler@latest deploy

  deploy-pages:
    name: Deploy frontend to Cloudflare Pages
    needs: [deploy-worker]
    if: ${{ always() && (github.event_name == 'push' || inputs.deploy_pages) }}
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME }}

      # Vite base for Cloudflare Pages.
      VITE_BASE: /

      # Build-time upload endpoint for the Upload Logs button.
      VITE_LOG_UPLOAD_URL: ${{ vars.VITE_LOG_UPLOAD_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloudflare settings
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$CF_PAGES_PROJECT_NAME" ]; then
            echo "Missing repository variable: CF_PAGES_PROJECT_NAME"
            exit 1
          fi
          if [ -z "$VITE_LOG_UPLOAD_URL" ]; then
            echo "WARNING: VITE_LOG_UPLOAD_URL is empty."
            echo "Upload Logs button will not work until you set repository variable VITE_LOG_UPLOAD_URL."
          fi

      - name: Install frontend dependencies
        shell: bash
        run: |
          # Work around npm/Rollup optional dependency lockfile issue:
          #   Cannot find module @rollup/rollup-linux-x64-gnu
          #
          # The current package-lock may have been generated on Windows and may not
          # contain Linux optional packages. For CI deploy, rebuild deps from
          # package.json instead of trusting the broken lockfile.
          rm -rf node_modules package-lock.json
          npm install --include=optional --no-audit --no-fund

      - name: Verify Rollup native optional package
        shell: bash
        run: |
          node -e "require('@rollup/rollup-linux-x64-gnu'); console.log('rollup native optional package OK')"

      - name: Build frontend
        run: npm run build

      - name: Deploy Pages with Wrangler
        run: |
          npx wrangler@latest pages deploy dist \
            --project-name="$CF_PAGES_PROJECT_NAME" \
            --branch="${GITHUB_REF_NAME}" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${GITHUB_SHA}"
