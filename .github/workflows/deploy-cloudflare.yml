name: Deploy to Cloudflare with Wrangler

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy frontend to Cloudflare Pages"
        type: boolean
        default: true
      deploy_worker:
        description: "Deploy log upload Worker"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-worker:
    name: Deploy log upload Worker
    if: ${{ github.event_name == 'push' || inputs.deploy_worker }}
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    outputs:
      worker_url: ${{ steps.worker_url.outputs.worker_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Validate Cloudflare settings
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Install worker dependencies
        working-directory: worker
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler@latest deploy

      - name: Compute Worker URL
        id: worker_url
        shell: bash
        run: |
          # If you use a custom route/domain, set repository variable VITE_LOG_UPLOAD_URL manually.
          # This default URL is correct for workers.dev subdomains in many setups.
          echo "worker_url=https://tetraflux-log-upload.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev" >> "$GITHUB_OUTPUT"

  deploy-pages:
    name: Deploy frontend to Cloudflare Pages
    needs: [deploy-worker]
    if: ${{ always() && (github.event_name == 'push' || inputs.deploy_pages) }}
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME }}

      # Vite base for Cloudflare Pages.
      VITE_BASE: /

      # Prefer explicit repository variable if set.
      # If empty, src/logging.ts will still show a clear error on Upload Logs.
      VITE_LOG_UPLOAD_URL: ${{ vars.VITE_LOG_UPLOAD_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare settings
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$CF_PAGES_PROJECT_NAME" ]; then
            echo "Missing repository variable: CF_PAGES_PROJECT_NAME"
            exit 1
          fi
          if [ -z "$VITE_LOG_UPLOAD_URL" ]; then
            echo "WARNING: VITE_LOG_UPLOAD_URL is empty."
            echo "Upload Logs button will not work until you set repository variable VITE_LOG_UPLOAD_URL."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy Pages with Wrangler
        run: |
          npx wrangler@latest pages deploy dist \
            --project-name="$CF_PAGES_PROJECT_NAME" \
            --branch="${GITHUB_REF_NAME}" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${GITHUB_SHA}"
