name: Deploy to Cloudflare with Wrangler

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy frontend to Cloudflare Pages"
        type: boolean
        default: true
      deploy_worker:
        description: "Deploy log upload Worker"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect deploy changes
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.filter.outputs.pages }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "pages=true" >> "$GITHUB_OUTPUT"
            echo "worker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD^)"
          fi

          changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          echo "$changed"

          pages=false
          worker=false
          if echo "$changed" | grep -Eq '^(src/|public/|index\.html$|package\.json$|package-lock\.json$|tsconfig\.json$|vite\.config\.ts$|tools/(sync_web_policy_r2|inspect_web_policy_json)\.py$|\.github/workflows/deploy-cloudflare\.yml$)'; then
            pages=true
          fi
          if echo "$changed" | grep -Eq '^worker/'; then
            worker=true
          fi

          echo "pages=$pages" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"

  deploy-worker:
    name: Deploy log upload Worker
    needs: [changes]
    if: ${{ (github.event_name == 'push' && needs.changes.outputs.worker == 'true') || (github.event_name == 'workflow_dispatch' && inputs.deploy_worker) }}
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Validate Cloudflare settings
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Install worker dependencies
        working-directory: worker
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install --include=optional --no-audit --no-fund

      - name: Deploy Worker
        working-directory: worker
        run: npm exec -- wrangler deploy

  deploy-pages:
    name: Deploy frontend to Cloudflare Pages
    needs: [changes]
    if: ${{ (github.event_name == 'push' && needs.changes.outputs.pages == 'true') || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages) }}
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME }}
      VITE_BASE: /
      VITE_LOG_UPLOAD_URL: ${{ vars.VITE_LOG_UPLOAD_URL }}

      R2_LOG_BUCKET: ${{ vars.R2_LOG_BUCKET || 'tetraflux-logs' }}
      R2_MODEL_KEY: ${{ vars.R2_MODEL_KEY || 'models/latest/web_policy.json' }}

      PY: .venv/bin/python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        if: ${{ env.R2_ACCESS_KEY_ID != '' && env.R2_SECRET_ACCESS_KEY != '' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements-training.txt

      - name: Create Python venv with uv
        if: ${{ env.R2_ACCESS_KEY_ID != '' && env.R2_SECRET_ACCESS_KEY != '' }}
        shell: bash
        run: |
          uv python install 3.11
          uv venv --python 3.11 .venv
          .venv/bin/python --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate Cloudflare settings
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$CF_PAGES_PROJECT_NAME" || (echo "Missing repository variable: CF_PAGES_PROJECT_NAME" && exit 1)
          if [ -z "$VITE_LOG_UPLOAD_URL" ]; then
            echo "WARNING: VITE_LOG_UPLOAD_URL is empty. Upload Logs button will not work."
          fi

      - name: Install Python deps for model sync
        if: ${{ env.R2_ACCESS_KEY_ID != '' && env.R2_SECRET_ACCESS_KEY != '' }}
        shell: bash
        run: |
          uv pip install --python "$PY" "boto3>=1.34.0"

      - name: Sync latest model from R2 before build
        if: ${{ env.R2_ACCESS_KEY_ID != '' && env.R2_SECRET_ACCESS_KEY != '' }}
        shell: bash
        run: |
          "$PY" tools/sync_web_policy_r2.py download \
            --bucket "$R2_LOG_BUCKET" \
            --key "$R2_MODEL_KEY" \
            --file public/models/web_policy.json \
            --allow-missing

      - name: Skip model sync without R2 credentials
        if: ${{ env.R2_ACCESS_KEY_ID == '' || env.R2_SECRET_ACCESS_KEY == '' }}
        shell: bash
        run: |
          echo "R2 secrets are missing; removing local stale public/models/web_policy.json"
          rm -f public/models/web_policy.json

      - name: Inspect model before build
        shell: bash
        run: |
          if [ -x "$PY" ]; then
            "$PY" tools/inspect_web_policy_json.py \
              --file public/models/web_policy.json \
              --label "PUBLIC MODEL BEFORE BUILD" \
              --allow-missing
          else
            test ! -f public/models/web_policy.json || (echo "Model exists but Python inspection was skipped" && exit 1)
            echo "PUBLIC MODEL BEFORE BUILD: missing (R2 credentials unavailable)"
          fi

      - name: Install frontend dependencies
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install --include=optional --no-audit --no-fund
          node -e "require('@rollup/rollup-linux-x64-gnu'); console.log('rollup native optional package OK')"

      - name: Build frontend
        run: npm run build

      - name: Inspect model in dist
        shell: bash
        run: |
          if [ -x "$PY" ]; then
            "$PY" tools/inspect_web_policy_json.py \
              --file dist/models/web_policy.json \
              --label "DEPLOY MODEL IN DIST" \
              --allow-missing
          else
            test ! -f dist/models/web_policy.json || (echo "Dist model exists but Python inspection was skipped" && exit 1)
            echo "DEPLOY MODEL IN DIST: missing (R2 credentials unavailable)"
          fi

      - name: Deploy Pages with Wrangler
        run: |
          npx --yes wrangler@latest pages deploy dist \
            --project-name="$CF_PAGES_PROJECT_NAME" \
            --branch="${GITHUB_REF_NAME}" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${GITHUB_SHA}"
