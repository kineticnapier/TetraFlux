name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build GitHub Pages artifact
    runs-on: ubuntu-latest

    # For GitHub Pages, vite.config.ts can use the GitHub Actions repo base.
    # Do not force VITE_BASE=/ here.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          # Work around npm/Rollup optional dependency lockfile issue:
          #   Cannot find module @rollup/rollup-linux-x64-gnu
          #
          # Do not use npm ci while package-lock.json is contaminated by
          # another OS. Re-resolve dependencies on the Linux runner.
          rm -rf node_modules package-lock.json
          npm install --include=optional --no-audit --no-fund

      - name: Verify Rollup native optional package
        shell: bash
        run: |
          node -e "require('@rollup/rollup-linux-x64-gnu'); console.log('rollup native optional package OK')"

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
