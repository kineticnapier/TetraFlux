name: Train policy from R2 logs

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs"
        type: number
        default: 30
      batch_size:
        description: "Batch size"
        type: number
        default: 256
      max_objects:
        description: "Max newest R2 jsonl objects to download. 0 = unlimited"
        type: number
        default: 500
      max_total_mb:
        description: "Max total download size in MB. 0 = unlimited"
        type: number
        default: 96
      recent_days:
        description: "Only list logs from the last N UTC days. 0 = all"
        type: number
        default: 14
      skip_audit:
        description: "Skip audit_web_logs.py"
        type: boolean
        default: false
      skip_artifact_upload:
        description: "Skip uploading training artifacts"
        type: boolean
        default: false
      num_workers:
        description: "PyTorch DataLoader workers"
        type: number
        default: 2
      quick_test:
        description: "Use tiny safe values: epochs=3, max_objects=30, max_total_mb=16, recent_days=3"
        type: boolean
        default: false
      max_holes:
        description: "Filter: max holes"
        type: number
        default: 20
      max_height:
        description: "Filter: max visible height"
        type: number
        default: 18
      min_round_length:
        description: "Filter: min round length"
        type: number
        default: 8
      max_bumpiness:
        description: "Filter: max bumpiness"
        type: number
        default: 52
      max_total_height:
        description: "Filter: max total column height"
        type: number
        default: 108
      max_avg_holes:
        description: "Filter: max average holes per round (-1 disables)"
        type: number
        default: 10
      max_avg_height:
        description: "Filter: max average max-height per round (-1 disables)"
        type: number
        default: 13
      reject_topout_nearby:
        description: "Filter: reject near-topout states"
        type: boolean
        default: true
      train_value_model:
        description: "Train and export value model"
        type: boolean
        default: true
      model_name:
        description: "Model name embedded into web_policy.json"
        type: string
        default: "ga_r2_clean"
      trigger_pages_deploy:
        description: "Trigger normal Cloudflare Pages deploy after uploading model to R2"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: train-from-r2
  cancel-in-progress: false

jobs:
  train:
    name: Download R2 logs, train, export, upload model
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      R2_LOG_BUCKET: ${{ vars.R2_LOG_BUCKET || 'tetraflux-logs' }}
      R2_LOG_PREFIX: ${{ vars.R2_LOG_PREFIX || 'raw/' }}
      R2_MODEL_KEY: ${{ vars.R2_MODEL_KEY || 'models/latest/web_policy.json' }}

      PY: .venv/bin/python
      COLLECTED_DIR: collected_logs_r2
      DATA_DIR: data
      MODEL_DIR: models/web_human_policy_r2
      PUBLIC_MODEL_JSON: public/models/web_policy.json
      PUBLIC_VALUE_JSON: public/models/web_value.json
      VALUE_MODEL_DIR: models/web_value_r2
      EFFECTIVE_EPOCHS: ${{ inputs.quick_test && 3 || inputs.epochs }}
      EFFECTIVE_MAX_OBJECTS: ${{ inputs.quick_test && 30 || inputs.max_objects }}
      EFFECTIVE_MAX_TOTAL_MB: ${{ inputs.quick_test && 16 || inputs.max_total_mb }}
      EFFECTIVE_RECENT_DAYS: ${{ inputs.quick_test && 3 || inputs.recent_days }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements-training.txt

      - name: Create Python venv with uv
        shell: bash
        run: |
          uv python install 3.11
          uv venv --python 3.11 .venv
          .venv/bin/python --version

      - name: Validate settings
        shell: bash
        run: |
          test -n "$R2_ACCESS_KEY_ID" || (echo "Missing secret: R2_ACCESS_KEY_ID" && exit 1)
          test -n "$R2_SECRET_ACCESS_KEY" || (echo "Missing secret: R2_SECRET_ACCESS_KEY" && exit 1)
          echo "R2_LOG_BUCKET=$R2_LOG_BUCKET"
          echo "R2_LOG_PREFIX=$R2_LOG_PREFIX"
          echo "R2_MODEL_KEY=$R2_MODEL_KEY"
          echo "epochs=$EFFECTIVE_EPOCHS max_objects=$EFFECTIVE_MAX_OBJECTS max_total_mb=$EFFECTIVE_MAX_TOTAL_MB recent_days=$EFFECTIVE_RECENT_DAYS"

      - name: Install training dependencies with uv
        shell: bash
        run: uv pip install --python "$PY" -r requirements-training.txt

      - name: Download logs from R2
        run: |
          "$PY" tools/download_r2_logs.py \
            --bucket "$R2_LOG_BUCKET" \
            --prefix "$R2_LOG_PREFIX" \
            --out-dir "$COLLECTED_DIR" \
            --max-objects "$EFFECTIVE_MAX_OBJECTS" \
            --max-total-mb "$EFFECTIVE_MAX_TOTAL_MB" \
            --recent-days "$EFFECTIVE_RECENT_DAYS"

      - name: Merge JSONL logs
        run: |
          mkdir -p "$DATA_DIR"
          "$PY" tools/merge_jsonl.py \
            --input "$COLLECTED_DIR" \
            --out "$DATA_DIR/merged_r2_logs.jsonl"

      - name: Audit merged logs
        if: ${{ !inputs.skip_audit }}
        run: |
          "$PY" tools/audit_web_logs.py \
            --input "$DATA_DIR/merged_r2_logs.jsonl" \
            --out "$DATA_DIR/audit_r2_logs.json"

      - name: Filter logs
        run: |
          "$PY" tools/filter_web_logs.py \
            --input "$DATA_DIR/merged_r2_logs.jsonl" \
            --out "$DATA_DIR/merged_r2_logs_clean.jsonl" \
            --trainer-version web-ft5-0.2.0 \
            --winner human \
            --max-holes "${{ inputs.max_holes }}" \
            --max-height "${{ inputs.max_height }}" \
            --max-pending-garbage 8 \
            --max-bumpiness "${{ inputs.max_bumpiness }}" \
            --max-total-height "${{ inputs.max_total_height }}" \
            --max-avg-holes "${{ inputs.max_avg_holes }}" \
            --max-avg-height "${{ inputs.max_avg_height }}" \
            --min-round-length "${{ inputs.min_round_length }}" \
            ${{ inputs.reject_topout_nearby && '--reject-topout-nearby' || '' }}

      - name: Build dataset
        run: |
          "$PY" tools/build_web_dataset.py \
            --input "$DATA_DIR/merged_r2_logs_clean.jsonl" \
            --out "$DATA_DIR/web_human_dataset_r2.jsonl"

      - name: Train policy
        run: |
          "$PY" tools/train_web_policy.py \
            --data "$DATA_DIR/web_human_dataset_r2.jsonl" \
            --out-dir "$MODEL_DIR" \
            --epochs "$EFFECTIVE_EPOCHS" \
            --batch-size "${{ inputs.batch_size }}" \
            --num-workers "${{ inputs.num_workers }}" \
            --device cpu

      - name: Export web policy JSON
        run: |
          mkdir -p public/models
          "$PY" tools/export_web_policy_json.py \
            --checkpoint "$MODEL_DIR/best_policy.pt" \
            --out "$PUBLIC_MODEL_JSON" \
            --model-name "${{ inputs.model_name }}_run${{ github.run_number }}_${{ github.run_attempt }}"

      - name: Inspect exported model
        run: |
          "$PY" tools/inspect_web_policy_json.py \
            --file "$PUBLIC_MODEL_JSON" \
            --label "EXPORTED MODEL BEFORE R2 UPLOAD"

      - name: Build value dataset
        if: ${{ inputs.train_value_model }}
        run: |
          "$PY" tools/build_web_value_dataset.py \
            --input "$DATA_DIR/merged_r2_logs.jsonl" \
            --out "$DATA_DIR/web_value_dataset_r2.jsonl"

      - name: Train value model
        if: ${{ inputs.train_value_model }}
        run: |
          "$PY" tools/train_web_value.py \
            --data "$DATA_DIR/web_value_dataset_r2.jsonl" \
            --out-dir "$VALUE_MODEL_DIR" \
            --epochs "$EFFECTIVE_EPOCHS" \
            --batch-size 512 \
            --device cpu

      - name: Export web value JSON
        if: ${{ inputs.train_value_model }}
        run: |
          "$PY" tools/export_web_value_json.py \
            --checkpoint "$VALUE_MODEL_DIR/best_value.pt" \
            --summary "$VALUE_MODEL_DIR/summary.json" \
            --out "$PUBLIC_VALUE_JSON" \
            --model-name "${{ inputs.model_name }}_value_run${{ github.run_number }}_${{ github.run_attempt }}"

      - name: Upload latest model JSON to R2
        run: |
          "$PY" tools/sync_web_policy_r2.py upload \
            --bucket "$R2_LOG_BUCKET" \
            --key "$R2_MODEL_KEY" \
            --file "$PUBLIC_MODEL_JSON"

      - name: Upload value model JSON to R2
        if: ${{ inputs.train_value_model }}
        run: |
          "$PY" tools/sync_web_policy_r2.py upload \
            --bucket "$R2_LOG_BUCKET" \
            --key "models/latest/web_value.json" \
            --file "$PUBLIC_VALUE_JSON"

      - name: Trigger normal frontend deploy
        if: ${{ inputs.trigger_pages_deploy }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Triggering deploy-cloudflare.yml so the latest app code builds normally and syncs the model from R2."
          gh workflow run deploy-cloudflare.yml \
            --ref "${GITHUB_REF_NAME}" \
            -f deploy_pages=true \
            -f deploy_worker=false

      - name: Upload training artifacts
        if: ${{ !inputs.skip_artifact_upload }}
        uses: actions/upload-artifact@v4
        with:
          name: tetraflux-trained-policy-r2-run-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            public/models/web_policy.json
            public/models/web_value.json
            models/web_human_policy_r2/best_policy.pt
            models/web_human_policy_r2/summary.json
            models/web_human_policy_r2/history.json
            models/web_human_policy_r2/actions.json
            data/audit_r2_logs.json
            data/merged_r2_logs_clean.meta.json
            data/web_human_dataset_r2.meta.json
            data/web_value_dataset_r2.jsonl.meta.json
            models/web_value_r2/summary.json
            collected_logs_r2/_download_summary.json
