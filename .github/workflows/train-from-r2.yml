name: Train policy from R2 logs

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs"
        type: number
        default: 30
      batch_size:
        description: "Batch size"
        type: number
        default: 256
      max_objects:
        description: "Max newest R2 jsonl objects to download. 0 = all"
        type: number
        default: 0
      max_holes:
        description: "Filter: max holes"
        type: number
        default: 20
      max_height:
        description: "Filter: max visible height"
        type: number
        default: 18
      min_round_length:
        description: "Filter: min round length"
        type: number
        default: 8
      model_name:
        description: "Model name embedded into web_policy.json"
        type: string
        default: "ga_r2_clean"
      trigger_pages_deploy:
        description: "Trigger normal Cloudflare Pages deploy after uploading model to R2"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: train-from-r2
  cancel-in-progress: false

jobs:
  train:
    name: Download R2 logs, train, export, upload model
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      R2_LOG_BUCKET: ${{ vars.R2_LOG_BUCKET || 'tetraflux-logs' }}
      R2_LOG_PREFIX: ${{ vars.R2_LOG_PREFIX || 'raw/' }}
      R2_MODEL_KEY: ${{ vars.R2_MODEL_KEY || 'models/latest/web_policy.json' }}

      PY: .venv/bin/python
      COLLECTED_DIR: collected_logs_r2
      DATA_DIR: data
      MODEL_DIR: models/web_human_policy_r2
      PUBLIC_MODEL_JSON: public/models/web_policy.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Create Python venv with uv
        shell: bash
        run: |
          uv python install 3.11
          uv venv --python 3.11 .venv
          .venv/bin/python --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate settings
        shell: bash
        run: |
          test -n "$R2_ACCESS_KEY_ID" || (echo "Missing secret: R2_ACCESS_KEY_ID" && exit 1)
          test -n "$R2_SECRET_ACCESS_KEY" || (echo "Missing secret: R2_SECRET_ACCESS_KEY" && exit 1)
          echo "R2_LOG_BUCKET=$R2_LOG_BUCKET"
          echo "R2_LOG_PREFIX=$R2_LOG_PREFIX"
          echo "R2_MODEL_KEY=$R2_MODEL_KEY"

      - name: Install frontend dependencies
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install --include=optional --no-audit --no-fund
          node -e "require('@rollup/rollup-linux-x64-gnu'); console.log('rollup native optional package OK')"

      - name: Install training dependencies with uv
        shell: bash
        run: uv pip install --python "$PY" -r requirements-training.txt

      - name: Download logs from R2
        run: |
          "$PY" tools/download_r2_logs.py \
            --bucket "$R2_LOG_BUCKET" \
            --prefix "$R2_LOG_PREFIX" \
            --out-dir "$COLLECTED_DIR" \
            --max-objects "${{ inputs.max_objects }}"

      - name: Merge JSONL logs
        run: |
          mkdir -p "$DATA_DIR"
          "$PY" tools/merge_jsonl.py \
            --input "$COLLECTED_DIR" \
            --out "$DATA_DIR/merged_r2_logs.jsonl"

      - name: Audit merged logs
        run: |
          "$PY" tools/audit_web_logs.py \
            --input "$DATA_DIR/merged_r2_logs.jsonl" \
            --out "$DATA_DIR/audit_r2_logs.json"

      - name: Filter logs
        run: |
          "$PY" tools/filter_web_logs.py \
            --input "$DATA_DIR/merged_r2_logs.jsonl" \
            --out "$DATA_DIR/merged_r2_logs_clean.jsonl" \
            --trainer-version web-ft5-0.2.0 \
            --winner human \
            --max-holes "${{ inputs.max_holes }}" \
            --max-height "${{ inputs.max_height }}" \
            --max-pending-garbage 8 \
            --min-round-length "${{ inputs.min_round_length }}"

      - name: Build dataset
        run: |
          "$PY" tools/build_web_dataset.py \
            --input "$DATA_DIR/merged_r2_logs_clean.jsonl" \
            --out "$DATA_DIR/web_human_dataset_r2.jsonl"

      - name: Train policy
        run: |
          "$PY" tools/train_web_policy.py \
            --data "$DATA_DIR/web_human_dataset_r2.jsonl" \
            --out-dir "$MODEL_DIR" \
            --epochs "${{ inputs.epochs }}" \
            --batch-size "${{ inputs.batch_size }}" \
            --device cpu

      - name: Export web policy JSON
        run: |
          mkdir -p public/models
          "$PY" tools/export_web_policy_json.py \
            --checkpoint "$MODEL_DIR/best_policy.pt" \
            --out "$PUBLIC_MODEL_JSON" \
            --model-name "${{ inputs.model_name }}_run${{ github.run_number }}_${{ github.run_attempt }}"

      - name: Inspect exported model
        run: |
          "$PY" tools/inspect_web_policy_json.py \
            --file "$PUBLIC_MODEL_JSON" \
            --label "EXPORTED MODEL BEFORE R2 UPLOAD"

      - name: Upload latest model JSON to R2
        run: |
          "$PY" tools/sync_web_policy_r2.py upload \
            --bucket "$R2_LOG_BUCKET" \
            --key "$R2_MODEL_KEY" \
            --file "$PUBLIC_MODEL_JSON"

      - name: Trigger normal frontend deploy
        if: ${{ inputs.trigger_pages_deploy }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Triggering deploy-cloudflare.yml so the latest app code builds normally and syncs the model from R2."
          gh workflow run deploy-cloudflare.yml \
            --ref "${GITHUB_REF_NAME}" \
            -f deploy_pages=true \
            -f deploy_worker=false

      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tetraflux-trained-policy-r2-run-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            public/models/web_policy.json
            models/web_human_policy_r2/best_policy.pt
            models/web_human_policy_r2/summary.json
            models/web_human_policy_r2/history.json
            models/web_human_policy_r2/actions.json
            data/audit_r2_logs.json
            data/merged_r2_logs_clean.meta.json
            data/web_human_dataset_r2.meta.json
            collected_logs_r2/_download_summary.json
