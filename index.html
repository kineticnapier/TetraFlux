<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TetraFlux Web FT5 Trainer</title>
    <meta name="description" content="TetraFlux Web FT5 Trainer: play FT5 Tetris matches, upload logs, and train a human-in-the-loop AI." />
    <meta name="theme-color" content="#070b14" />

    <meta property="og:title" content="TetraFlux Web FT5 Trainer" />
    <meta property="og:description" content="Play FT5 Tetris matches, upload logs, and train a human-in-the-loop AI." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tetraflux.pages.dev/" />
    <meta property="og:image" content="https://tetraflux.pages.dev/tetraflux-og.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TetraFlux Web FT5 Trainer" />
    <meta name="twitter:description" content="Play FT5 Tetris matches, upload logs, and train a human-in-the-loop AI." />
    <meta name="twitter:image" content="https://tetraflux.pages.dev/tetraflux-og.svg" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/tetraflux-icon.svg" />
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="1280" height="820"></canvas>

      <div id="toolbar">
        <button id="newMatch">New FT5</button>
        <button id="nextRound">Next Round</button>
        <button id="settingsBtn">Settings</button>

        <button id="downloadLogs">Download Logs</button>
        <button id="uploadLogs">Upload Logs</button>
        <button id="copyLogs">Copy Logs</button>
        <button id="clearLogs">Clear Local Logs</button>

        <span id="presenceBadge">playing: ?</span>
      </div>

      <p id="status"></p>

      <div id="settingsModal" class="modal hidden" aria-hidden="true">
        <div class="modal-card">
          <div class="modal-header">
            <h2>Settings</h2>
            <button id="closeSettings" class="small-button">×</button>
          </div>

          <div class="settings-grid">
            <fieldset>
              <legend>Speed</legend>

              <label>AI mino/s
                <input id="aiPps" type="number" min="0.1" max="20" step="0.1" value="1.4" />
              </label>

              <label>DAS ms
                <input id="dasMs" type="number" min="0" max="500" step="5" value="130" />
              </label>

              <label>ARR ms
                <input id="arrMs" type="number" min="0" max="200" step="1" value="10" />
              </label>

              <label>SDF cells/s
                <input id="sdf" type="number" min="1" max="240" step="1" value="30" />
              </label>

              <label>Gravity cells/s
                <input id="gravity" type="number" min="0" max="60" step="0.1" value="1" />
              </label>

              <label>Lock delay ms
                <input id="lockDelayMs" type="number" min="0" max="3000" step="10" value="500" />
              </label>
            </fieldset>

            <fieldset>
              <legend>Key bindings</legend>

              <label>Left
                <input id="keyLeft" class="key-input" value="Left" />
              </label>

              <label>Right
                <input id="keyRight" class="key-input" value="Right" />
              </label>

              <label>Soft drop
                <input id="keySoftDrop" class="key-input" value="Down" />
              </label>

              <label>Rotate CW
                <input id="keyRotateCw" class="key-input" value="Up, X" />
              </label>

              <label>Rotate CCW
                <input id="keyRotateCcw" class="key-input" value="Ctrl, Z" />
              </label>

              <label>Rotate 180
                <input id="keyRotate180" class="key-input" value="A" />
              </label>

              <label>Hold
                <input id="keyHold" class="key-input" value="Shift, C" />
              </label>

              <label>Hard drop
                <input id="keyHardDrop" class="key-input" value="Space" />
              </label>

              <label>Next round
                <input id="keyNextRound" class="key-input" value="Enter" />
              </label>

              <label>Reset match
                <input id="keyReset" class="key-input" value="R" />
              </label>
            </fieldset>
          </div>

          <p class="hint">
            Multiple keys can be written with commas, e.g. "Ctrl, Z". While focused, pressing a key replaces the field with that key.
          </p>

          <div class="modal-actions">
            <button id="resetSettings">Reset defaults</button>
            <button id="saveSettings">Save settings</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
