<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TetraFlux Web FT5 Trainer</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="1280" height="820"></canvas>

      <div id="toolbar">
        <button id="newMatch">New FT5</button>
        <button id="nextRound">Next Round</button>

        <label>AI mino/s
          <input id="aiPps" type="number" min="0.1" max="20" step="0.1" value="1.4" />
        </label>

        <label>DAS ms
          <input id="dasMs" type="number" min="0" max="500" step="5" value="130" />
        </label>

        <label>ARR ms
          <input id="arrMs" type="number" min="0" max="200" step="1" value="10" />
        </label>

        <label>SDF cells/s
          <input id="sdf" type="number" min="1" max="240" step="1" value="30" />
        </label>

        <button id="downloadLogs">Download Logs</button>
        <button id="uploadLogs">Upload Logs</button>
        <button id="copyLogs">Copy Logs</button>
        <button id="clearLogs">Clear Local Logs</button>
      </div>

      <p id="status"></p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
