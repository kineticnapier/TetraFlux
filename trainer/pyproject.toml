[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tetraflux-python"
version = "0.2.0"
description = "Pure-Python Tetris-like game, renderer, and learning lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
game = [
  "pygame>=2.6,<3",
]
ui = [
  "gradio>=6.14,<7",
  "pygame>=2.6,<3",
]
rl = [
  "gymnasium>=1.2,<2",
  "numpy>=2,<3",
]
learning = [
  "numpy>=2,<3",
  "torch>=2.7",
]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
tetraflux = "tetraflux_trainer.cli:main"
tetraflux-game = "tetraflux_trainer.game:main"
tetraflux-lab = "tetraflux_trainer.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tetraflux_engine*", "tetraflux_trainer*"]
