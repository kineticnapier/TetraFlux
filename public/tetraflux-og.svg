<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="TetraFlux Web FT5 Trainer">
  <defs>
    <radialGradient id="bg" cx="20%" cy="18%" r="88%">
      <stop offset="0" stop-color="#123b4d"/>
      <stop offset=".45" stop-color="#08152f"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g transform="translate(160 210)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="64" height="64" rx="14" fill="#22d3ee"/>
      <rect x="64" y="0" width="64" height="64" rx="14" fill="#22d3ee"/>
      <rect x="128" y="0" width="64" height="64" rx="14" fill="#22d3ee"/>
      <rect x="64" y="64" width="64" height="64" rx="14" fill="#22d3ee"/>
    </g>
    <g opacity=".20">
      <rect x="0" y="0" width="64" height="64" rx="14" fill="#ffffff"/>
      <rect x="64" y="0" width="64" height="64" rx="14" fill="#ffffff"/>
      <rect x="128" y="0" width="64" height="64" rx="14" fill="#ffffff"/>
      <rect x="64" y="64" width="64" height="64" rx="14" fill="#ffffff"/>
    </g>
  </g>

  <text x="430" y="208" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="80" font-weight="900" fill="#f8fafc">TetraFlux</text>
  <text x="430" y="270" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="800" fill="#67e8f9">Web FT5 Human-in-the-loop Trainer</text>
  <text x="430" y="335" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#cbd5e1">Play FT5 matches, upload logs, train a Tetris AI.</text>
</svg>
